content_filter.settings:
  type: config_object
  label: Settings
  mapping:
    content_filter_bundles:
      type: sequence
      label: 'List of bundles to filter'
      orderby: value
      sequence:
        type: string
        label: 'Bundle'
    content_filter_filters:
      type: sequence
      label: 'List of fields to filter'
      orderby: key
      sequence:
        type: boolean
        label: 'Field status'
    content_filter_menus:
      type: boolean
      label: 'Show menus'
