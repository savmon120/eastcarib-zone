content_filter.settings:
  path: '/admin/config/user-interface/content-filter'
  defaults:
    _form: '\Drupal\content_filter\Form\ContentFilterSettingsForm'
    _title: 'Content filter settings'
  requirements:
    _permission: 'administer content_filter'
content_filter.main:
  path: '/admin/content/filtered'
  defaults:
    _controller: '\Drupal\content_filter\Controller\MenuIndexController::getContent'
    _title: 'Filtered content by content type'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE
content_filter.filtered:
  path: '/admin/content/filtered/{node_type}'
  defaults:
    _controller: '\Drupal\content_filter\Controller\ContentPageController::getBlockContents'
    _title_callback: '\Drupal\content_filter\Controller\ContentPageController::getTitle'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE
