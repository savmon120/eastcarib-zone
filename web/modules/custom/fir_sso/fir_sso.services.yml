services:
  logger.channel.fir_sso:
    parent: logger.channel_base
    arguments: ['fir_sso']

  fir_sso.vatsim_user_manager:
    class: Drupal\fir_sso\Service\VatsimUserManager
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.fir_sso'

  fir_sso.vatsim_login_subscriber:
    class: Drupal\fir_sso\EventSubscriber\VatsimLoginSubscriber
    arguments:
      - '@fir_sso.vatsim_user_manager'
      - '@logger.channel.fir_sso'
    tags:
      - { name: event_subscriber }
  oauth2_client.oauth2_client.vatsim:
    class: Drupal\fir_sso\Plugin\Oauth2Client\VatsimClient
    calls:
      - [setAuthorizationUri, ['https://auth.vatsim.net/oauth/authorize']]
      - [setTokenUri, ['https://auth.vatsim.net/oauth/token']]
      - [setResourceUri, ['https://auth.vatsim.net/api/user']]
