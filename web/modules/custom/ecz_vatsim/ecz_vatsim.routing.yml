ecz_vatsim.settings:
  path: '/admin/config/services/vatsim'
  defaults:
    _form: '\Drupal\ecz_vatsim\Form\VatsimSettingsForm'
    _title: 'VATSIM Settings'
  requirements:
    _permission: 'administer site configuration'

ecz_vatsim.live_data:
  path: '/api/vatsim/live'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\VatsimProxyController::getLiveData'
    _title: 'VATSIM Live Data'
  requirements:
    _permission: 'access content'

ecz_vatsim.sync_events:
  path: '/admin/config/services/vatsim/sync-events'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\VatsimEventsSyncController::sync'
    _title: 'Sync VATSIM Events'
  requirements:
    _permission: 'administer site configuration'

ecz_vatsim.events_page:
  path: '/events'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\VatsimEventsPageController::viewAll'
    _title: 'Upcoming Events'
  requirements:
    _permission: 'access content'

ecz_vatsim.stats:
  path: '/api/vatsim/stats/{cid}'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\VatsimStatsController::getStats'
  requirements:
    _permission: 'access content'

ecz_vatsim.atc:
  path: '/api/vatsim/atc/{cid}'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\VatsimStatsController::getAtc'
  requirements:
    _permission: 'access content'

ecz_vatsim.weather_page:
  path: '/dashboard/{icao}'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\WeatherController::page'
    _title_callback: '\Drupal\ecz_vatsim\Controller\WeatherController::title'
    icao: 'TBPB'
  requirements:
    _permission: 'access content'

ecz_vatsim.weather_data:
  path: '/api/weather/{icao}'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\WeatherController::data'
  requirements:
    _permission: 'access content'

ecz_vatsim.weather_overview:
  path: '/api/weather-overview'
  defaults:
    _controller: '\Drupal\ecz_vatsim\Controller\WeatherController::overview'
  requirements:
    _permission: 'access content'
