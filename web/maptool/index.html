<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eastern Caribbean Zone · VATSIM Airspace Overview</title>
  <meta name="description" content="Interactive 3D map of the VATSIM Eastern Caribbean Zone airspace — Curaçao FIR, Juliana TMA and Piarco FIR." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f14'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234dabf7' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2338d9a9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <h1>Eastern Caribbean Zone</h1>
        <p class="sub">VATSIM / VATCAR · airspace &amp; ATC-position overview</p>
      </header>

      <div class="credit">
        <span class="credit-label">Made &amp; designed by</span>
        <a class="credit-name" href="mailto:d.peters@vatsim.net" title="Email d.peters@vatsim.net">Danny&nbsp;-| 963639 |-</a>
      </div>

      <section class="panel">
        <div class="panel-title">View</div>
        <div class="seg" id="dim-toggle">
          <button data-dim="3d" class="active">3D</button>
          <button data-dim="2d">2D flat</button>
        </div>
        <label class="row">
          <span>Basemap</span>
          <select id="basemap">
            <option value="dark">Dark</option>
            <option value="satellite">Satellite</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label class="row slider">
          <span>Vertical exaggeration <b id="exag-val">12×</b></span>
          <input type="range" id="exag" min="1" max="40" step="1" value="12" />
        </label>
        <label class="row slider">
          <span>Airspace opacity <b id="op-val">50%</b></span>
          <input type="range" id="opacity" min="10" max="90" step="5" value="50" />
        </label>
      </section>

      <section class="panel">
        <div class="panel-title">Zones</div>
        <div id="groups" class="chips"></div>
      </section>

      <section class="panel">
        <div class="panel-title">Airspace types</div>
        <div id="types" class="chips"></div>
      </section>

      <section class="panel">
        <div class="panel-title">Controlling positions <span class="hint">click to isolate</span></div>
        <div id="positions" class="pos-list"></div>
      </section>

      <section class="panel legend">
        <div class="panel-title">Legend (by type)</div>
        <div id="legend" class="legend-grid"></div>
      </section>

      <footer class="side-foot">
        <div class="warn">Simulation reference only — not for real-world navigation.</div>
      </footer>
    </aside>

    <div id="map"></div>

    <div id="info" class="hidden">
      <button id="info-close" aria-label="close">×</button>
      <div id="info-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
